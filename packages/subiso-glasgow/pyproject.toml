[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "subiso-glasgow"
version = "0.1.2"
description = "Glasgow subgraph solver backend for subiso"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES/*"]
dependencies = [
    "subiso",
    "networkx>=3.4",
]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["subiso_glasgow"]
minimum-version = "0.10"
